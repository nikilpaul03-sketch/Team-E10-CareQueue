# ===================================================================
# Team E10 - Smart Public Healthcare Appointment & Queue System
# Phase 2 Application & Database Configuration
# ===================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Information
spring.application.name=Smart Public Healthcare Appointment and Queue Management System
app.team=Team E10
app.version=1.0.0-SNAPSHOT

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===================================================================
# MySQL 8.x Database Configuration
# Credentials resolved via Environment Variables (DB_URL, DB_USERNAME, DB_PASSWORD)
# with local development defaults
# ===================================================================
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/healthcare_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate ORM Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.teame10.healthcare=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
